  expected_action: BLOCK
  expected_rule_id: FS-001

- case_id: v213-url-03-nested-metadata-service
  mcp38_id: V213-URL-03
  title: Block nested metadata service URL in custom tool schema
  harness: rules_engine
  input:
    jsonrpc: "2.0"
    id: v213-url-3
    method: tools/call
    params:
      name: custom_connector
      arguments:
        request:
          destination:
            endpoint: "http://169%2e254%2e169%2e254/latest/meta-data/"
  expected_action: BLOCK
  expected_rule_id: NET-006

- case_id: v213-url-04-encoded-loopback-warn
  mcp38_id: V213-URL-04
  title: Warn on percent-encoded loopback URL under balanced profile
  harness: rules_engine
  input:
    jsonrpc: "2.0"
    id: v213-url-4
    method: tools/call
    params:
      name: fetch_url
      arguments:
        url: "http://127%2e0%2e0%2e1/admin"
  expected_action: WARN
  expected_rule_id: NET-004

- case_id: v213-url-05-userinfo-loopback-warn
  mcp38_id: V213-URL-05
  title: Warn on userinfo host-confusion loopback URL under balanced profile
  harness: rules_engine
  input:
    jsonrpc: "2.0"
    id: v213-url-5
    method: tools/call
    params:
      name: fetch_url
      arguments:
        url: "http://safe.example@127.0.0.1/admin"
