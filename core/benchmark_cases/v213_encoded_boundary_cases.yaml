- case_id: v213-url-01-encoded-metadata-service
  mcp38_id: V213-URL-01
  title: Block percent-encoded cloud metadata service URL
  harness: rules_engine
  input:
    jsonrpc: "2.0"
    id: v213-url-1
    method: tools/call
    params:
      name: fetch_url
      arguments:
        url: "http://169%2e254%2e169%2e254/latest/meta-data/"
  expected_action: BLOCK
  expected_rule_id: NET-006

- case_id: v213-url-02-dashed-metadata-service
  mcp38_id: V213-URL-02
  title: Block dashed cloud metadata service host variant
  harness: rules_engine
  input:
    jsonrpc: "2.0"
    id: v213-url-2
    method: tools/call
    params:
      name: fetch_url
      arguments:
        url: "http://169-254-169-254/latest/meta-data/"
  expected_action: BLOCK
  expected_rule_id: NET-006

- case_id: v213-path-01-encoded-sensitive-unix-path
  mcp38_id: V213-PATH-01
  title: Block percent-encoded sensitive Unix path
  harness: rules_engine
  input:
    jsonrpc: "2.0"
    id: v213-path-1
    method: tools/call
    params:
      name: read_file
      arguments:
        path: "%2fetc%2fshadow"
  expected_action: BLOCK
  expected_rule_id: FS-001

- case_id: v213-path-02-redundant-slash-sensitive-unix-path
  mcp38_id: V213-PATH-02
