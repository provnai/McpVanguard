name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev]"

      - name: Run Release Validation Suite
        run: python -m pytest tests/ -v --tb=short

      - name: Build distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Smoke install built wheel
        run: |
          python -m venv .release-smoke-venv
          . .release-smoke-venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          cd "$(mktemp -d)"
          vanguard --help
          vanguard benchmark-run --json-output > benchmark.json
          vanguard gpu-harden --json-output > hardening.json
          vanguard gpu-thresholds --json-output > thresholds.json
          python -c "import json; [json.load(open(p)) for p in ('benchmark.json', 'hardening.json', 'thresholds.json')]"
          python -m core.demo_verify > demo.json
          python -c "import json; r=json.load(open('demo.json')); assert all(s['passed'] for s in r['sessions'])"
          python -O -m core.demo_verify > demo-optimized.json
          python -c "import json; r=json.load(open('demo-optimized.json')); assert all(s['passed'] for s in r['sessions'])"
          pip install "mcp==2.0.0"
          python -m core.demo_verify > demo-sdk-floor.json
          python -c "import json; r=json.load(open('demo-sdk-floor.json')); assert all(s['passed'] for s in r['sessions'])"

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/

  publish:
    name: Secure Publish to PyPI
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
